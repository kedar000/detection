<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Screen Capture + Focus Blur + Keyboard Test</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 30px;
      }

      button {
        padding: 10px 18px;
        margin-right: 10px;
        cursor: pointer;
      }

      input {
        padding: 10px;
        margin-top: 20px;
        width: 300px;
      }

      #status {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ccc;
      }

      #logs {
        margin-top: 20px;
        height: 350px;
        overflow-y: auto;
        background: #111;
        color: white;
        padding: 10px;
        font-family: monospace;
      }

      .focus {
        color: #00ff00;
      }

      .blur {
        color: #ff4444;
      }

      .capture {
        color: #00ffff;
      }

      .keyboard {
        color: #ffffff;
      }

      .blocked {
        color: #ff9900;
      }

      #preview {
        margin-top: 20px;
        max-width: 600px;
        width: 100%;
        border: 1px solid #ccc;
      }
    </style>
  </head>

  <body>

    <h1>Screen Capture Test</h1>

    <!-- -----------------------------------------
         Controls
    ------------------------------------------ -->

    <button id="startBtn">
      Start Screen Capture
    </button>

    <button id="stopBtn">
      Stop Capture
    </button>

    <br />

    <input
      id="keyboardInput"
      type="text"
      placeholder="Type something here"
      autocomplete="off"
    />


    <!-- -----------------------------------------
         Status
    ------------------------------------------ -->

    <div id="status">
      Status:
      <strong id="statusText">
        Not Started
      </strong>
    </div>


    <!-- -----------------------------------------
         Hidden video

         Contains the MediaStream returned by
         getDisplayMedia()
    ------------------------------------------ -->

    <video
      id="screenVideo"
      autoplay
      muted
      playsinline
      style="display: none;"
    ></video>


    <!-- -----------------------------------------
         Latest captured image
    ------------------------------------------ -->

    <h3>
      Latest Captured Image
    </h3>

    <img
      id="preview"
      alt="Latest screen capture"
    />


    <!-- -----------------------------------------
         Event logs
    ------------------------------------------ -->

    <h3>
      Event Logs
    </h3>

    <div id="logs"></div>


    <script>

      // ============================================================
      // DOM ELEMENTS
      // ============================================================

      const screenVideo =
        document.getElementById("screenVideo");

      const preview =
        document.getElementById("preview");

      const statusText =
        document.getElementById("statusText");

      const logs =
        document.getElementById("logs");

      const startBtn =
        document.getElementById("startBtn");

      const stopBtn =
        document.getElementById("stopBtn");

      const keyboardInput =
        document.getElementById("keyboardInput");


      // ============================================================
      // GLOBAL STATE
      // ============================================================

      let screenStream = null;

      let captureInterval = null;

      /*
       * Keeps track of keys currently pressed.
       *
       * We use event.code instead of event.key because
       * event.code is more stable for tracking physical keys.
       */

      const pressedKeys = new Set();


      // ============================================================
      // LOGGER
      // ============================================================

      function log(message, type = "") {

        const time =
          new Date().toLocaleTimeString();

        const element =
          document.createElement("div");

        element.className = type;

        element.textContent =
          `[${time}] ${message}`;

        logs.prepend(element);

        console.log(
          `[${time}] ${message}`
        );
      }


      // ============================================================
      // KEY NAME
      // ============================================================

      function getKeyName(event) {

        switch (event.key) {

          case " ":
            return "Space";

          case "Control":
            return "Control";

          case "Shift":
            return "Shift";

          case "Meta":
            return "Command";

          case "Alt":
            return "Alt";

          case "Enter":
            return "Enter";

          case "Escape":
            return "Escape";

          case "Backspace":
            return "Backspace";

          case "Tab":
            return "Tab";

          case "CapsLock":
            return "CapsLock";

          case "ArrowUp":
            return "ArrowUp";

          case "ArrowDown":
            return "ArrowDown";

          case "ArrowLeft":
            return "ArrowLeft";

          case "ArrowRight":
            return "ArrowRight";

          case "Delete":
            return "Delete";

          case "Home":
            return "Home";

          case "End":
            return "End";

          case "PageUp":
            return "PageUp";

          case "PageDown":
            return "PageDown";

          default:
            return event.key;
        }
      }


      // ============================================================
      // GET MODIFIERS
      // ============================================================

      function getModifiers(event) {

        const modifiers = [];


        if (event.ctrlKey) {
          modifiers.push("Control");
        }


        if (event.metaKey) {
          modifiers.push("Command");
        }


        if (event.shiftKey) {
          modifiers.push("Shift");
        }


        if (event.altKey) {
          modifiers.push("Alt");
        }


        return modifiers;
      }


      // ============================================================
      // GET KEY COMBINATION
      // ============================================================

      function getCombination(event) {

        const key =
          getKeyName(event);

        const modifiers =
          getModifiers(event);


        /*
         * Don't duplicate modifier keys.
         *
         * Example:
         *
         * Pressing Control should display:
         *
         * Control
         *
         * instead of:
         *
         * Control + Control
         */

        if (
          key === "Control" ||
          key === "Command" ||
          key === "Shift" ||
          key === "Alt"
        ) {

          return key;
        }


        return [
          ...modifiers,
          key
        ].join(" + ");
      }


      // ============================================================
      // KEYBOARD EVENT LOGGER
      // ============================================================

      function logKeyboardEvent(
        event,
        eventType
      ) {

        const combination =
          getCombination(event);

        log(
          `${eventType}: ${combination}`,
          "keyboard"
        );


        /*
         * Also print complete keyboard event
         * information in browser console.
         */

        console.log(
          "Keyboard Event:",
          {
            type: eventType,
            key: event.key,
            code: event.code,
            ctrlKey: event.ctrlKey,
            shiftKey: event.shiftKey,
            altKey: event.altKey,
            metaKey: event.metaKey,
            repeat: event.repeat
          }
        );
      }


      // ============================================================
      // KEY DOWN
      // ============================================================

      window.addEventListener(
        "keydown",
        (event) => {

          /*
           * Remember this key.
           */

          pressedKeys.add(
            event.code
          );


          /*
           * Log the keyboard event.
           */

          logKeyboardEvent(
            event,
            "KEY DOWN"
          );


          // ========================================================
          // BLOCK CTRL + SHIFT
          // Windows / Linux
          // ========================================================

          if (
            event.ctrlKey &&
            event.shiftKey
          ) {

            event.preventDefault();

            event.stopPropagation();


            log(
              `BLOCKED: ${getCombination(event)}`,
              "blocked"
            );


            return;
          }


          // ========================================================
          // BLOCK COMMAND + SHIFT
          // macOS
          // ========================================================

          if (
            event.metaKey &&
            event.shiftKey
          ) {

            event.preventDefault();

            event.stopPropagation();


            log(
              `BLOCKED: ${getCombination(event)}`,
              "blocked"
            );


            return;
          }


          // ========================================================
          // BLOCK CTRL COMBINATIONS
          // ========================================================

          if (
            event.ctrlKey
          ) {

            event.preventDefault();


            log(
              `CONTROL COMBINATION: ${getCombination(event)}`,
              "blocked"
            );
          }


          // ========================================================
          // BLOCK COMMAND COMBINATIONS
          // ========================================================

          if (
            event.metaKey
          ) {

            event.preventDefault();


            log(
              `COMMAND COMBINATION: ${getCombination(event)}`,
              "blocked"
            );
          }

        },
        true
      );


      // ============================================================
      // KEY UP
      // ============================================================

      window.addEventListener(
        "keyup",
        (event) => {

          /*
           * Remove key from pressed set.
           */

          pressedKeys.delete(
            event.code
          );


          /*
           * Log key release.
           */

          logKeyboardEvent(
            event,
            "KEY UP"
          );

        },
        true
      );


      // ============================================================
      // WINDOW FOCUS
      // ============================================================

      window.addEventListener(
        "focus",
        () => {

          statusText.textContent =
            "Window Focused";


          log(
            "WINDOW FOCUS",
            "focus"
          );

        }
      );


      // ============================================================
      // WINDOW BLUR
      // ============================================================

      window.addEventListener(
        "blur",
        () => {

          statusText.textContent =
            "Window NOT Focused";


          log(
            "WINDOW BLUR",
            "blur"
          );


          /*
           * If keys were held down when the
           * browser lost focus, we won't necessarily
           * receive their keyup events.
           *
           * Therefore clear our internal state.
           */

          if (
            pressedKeys.size > 0
          ) {

            log(
              `Clearing ${pressedKeys.size} pressed keys`,
              "blur"
            );

            pressedKeys.clear();
          }


          /*
           * Warning popup.
           */

          //alert(
           // "Warning: You have left the test window!"
          //);

        }
      );


      // ============================================================
      // START SCREEN CAPTURE
      // ============================================================

      async function startScreenCapture() {

        try {

          log(
            "Requesting screen capture..."
          );


          /*
           * Ask browser for screen/window/tab
           * capture.
           */

          screenStream =
            await navigator.mediaDevices
              .getDisplayMedia({
                video: true,
                audio: false
              });


          /*
           * Put screen stream into hidden
           * video element.
           */

          screenVideo.srcObject =
            screenStream;


          await screenVideo.play();


          statusText.textContent =
            "Screen Capturing";


          log(
            "Screen capture started",
            "capture"
          );


          /*
           * Get video track.
           */

          const videoTrack =
            screenStream.getVideoTracks()[0];


          /*
           * Detect user pressing "Stop sharing"
           * in browser UI.
           */

          videoTrack.addEventListener(
            "ended",
            () => {

              log(
                "Screen sharing stopped"
              );


              stopScreenCapture();

            }
          );


          /*
           * Wait until video dimensions
           * become available.
           */

          await waitForVideo();


          /*
           * Capture immediately.
           */

          captureScreen();


          /*
           * Capture every 5 seconds.
           */

          captureInterval =
            setInterval(
              captureScreen,
              5000
            );


        } catch (error) {

          console.error(error);


          log(
            `Screen capture error: ${error.message}`
          );

        }

      }


      // ============================================================
      // WAIT FOR VIDEO
      // ============================================================

      function waitForVideo() {

        return new Promise(
          (resolve) => {

            /*
             * Already available.
             */

            if (
              screenVideo.videoWidth &&
              screenVideo.videoHeight
            ) {

              resolve();

              return;
            }


            /*
             * Wait for metadata.
             */

            screenVideo.addEventListener(
              "loadedmetadata",
              resolve,
              {
                once: true
              }
            );

          }
        );

      }


      // ============================================================
      // CAPTURE SCREEN USING CANVAS
      // ============================================================

      async function captureScreen() {

        /*
         * Check whether video is ready.
         */

        if (
          !screenVideo.videoWidth ||
          !screenVideo.videoHeight
        ) {

          log(
            "Video dimensions are not available"
          );

          return;
        }


        // ==========================================================
        // CREATE CANVAS
        // ==========================================================

        const canvas =
          document.createElement(
            "canvas"
          );


        // ==========================================================
        // SCREEN DIMENSIONS
        // ==========================================================

        const width =
          screenVideo.videoWidth;

        const height =
          screenVideo.videoHeight;


        canvas.width =
          width;

        canvas.height =
          height;


        // ==========================================================
        // CANVAS CONTEXT
        // ==========================================================

        const context =
          canvas.getContext("2d");


        // ==========================================================
        // DRAW CURRENT SCREEN FRAME
        // ==========================================================

        context.drawImage(
          screenVideo,
          0,
          0,
          canvas.width,
          canvas.height
        );


        // ==========================================================
        // PREVIEW IMAGE
        // ==========================================================

        preview.src =
          canvas.toDataURL(
            "image/jpeg",
            0.8
          );


        // ==========================================================
        // CANVAS → JPEG BLOB
        // ==========================================================

        canvas.toBlob(
          async (blob) => {

            if (!blob) {

              log(
                "Failed to create image"
              );

              return;
            }


            /*
             * Send image to server.
             */

            await saveImage(
              blob
            );

          },
          "image/jpeg",
          0.8
        );


        log(
          `Screen captured: ${width}x${height}`,
          "capture"
        );

      }


      // ============================================================
      // SAVE IMAGE
      // ============================================================

      async function saveImage(
        blob
      ) {

        try {

          const formData =
            new FormData();


          formData.append(
            "image",
            blob,
            `screen-${Date.now()}.jpg`
          );


          const response =
            await fetch(
              "/save-screenshot",
              {
                method: "POST",
                body: formData
              }
            );


          const result =
            await response.json();


          if (
            result.success
          ) {

            log(
              `Saved: ${result.filename}`,
              "capture"
            );

          } else {

            log(
              `Save failed: ${result.error}`
            );

          }

        } catch (error) {

          console.error(error);


          log(
            `Save error: ${error.message}`
          );

        }

      }


      // ============================================================
      // STOP SCREEN CAPTURE
      // ============================================================

      function stopScreenCapture() {

        /*
         * Stop interval.
         */

        if (
          captureInterval
        ) {

          clearInterval(
            captureInterval
          );

          captureInterval =
            null;
        }


        /*
         * Stop media tracks.
         */

        if (
          screenStream
        ) {

          screenStream
            .getTracks()
            .forEach(
              (track) => {
                track.stop();
              }
            );

          screenStream =
            null;
        }


        /*
         * Remove stream.
         */

        screenVideo.srcObject =
          null;


        statusText.textContent =
          "Not Capturing";


        log(
          "Screen capture stopped"
        );

      }


      // ============================================================
      // BUTTON: START
      // ============================================================

      startBtn.addEventListener(
        "click",
        () => {

          startScreenCapture();

        }
      );


      // ============================================================
      // BUTTON: STOP
      // ============================================================

      stopBtn.addEventListener(
        "click",
        () => {

          stopScreenCapture();

        }
      );


      // ============================================================
      // INITIAL LOG
      // ============================================================

      log(
        "Test page initialized"
      );

    </script>

  </body>
</html>
